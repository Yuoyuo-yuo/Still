<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'self'">
  <title>Still — Personal Journal</title>
  <meta name="description" content="A quiet, local space for your daily thoughts.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232d574c'/%3E%3Cpath d='M10 8h13v17H10zM13 8v17' stroke='white' fill='none'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css"><script src="app.js" defer></script>
</head>
<body>
  <aside class="sidebar">
    <header class="brand"><span class="brand-icon" aria-hidden="true">S.</span><div><h1>Still</h1><p>A personal journal</p></div><button id="theme" class="icon-button" aria-label="Switch to dark mode" title="Switch theme">☾</button></header>
    <button id="new" class="primary new-button"><span aria-hidden="true">＋</span> New Entry</button>
    <div class="search-box"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="Search your journal" aria-label="Search by title, content, or date"></div>
    <div class="archive-heading"><h2>YOUR ENTRIES</h2><span id="count">0</span></div>
    <nav id="archive" aria-label="Diary archive"></nav>
    <footer class="sidebar-footer"><span>Stored on this device</span><div><button id="export">Export</button><button id="import">Import</button><input id="import-file" type="file" accept="application/json,.json" hidden></div></footer>
  </aside>
  <main>
    <header class="toolbar"><div class="breadcrumb">My journal <span>/</span> <span id="mode">A fresh page</span></div><div class="actions"><button id="delete" class="danger" hidden>Delete</button><button id="edit" hidden>Edit</button><button id="save" class="primary" hidden>Save</button></div></header>
    <section id="empty" class="empty"><div class="empty-symbol" aria-hidden="true">✎</div><p class="eyebrow">A LITTLE SPACE FOR YOURSELF</p><h2>Every day has a story.</h2><p>A moment worth keeping. A thought to return to.<br>Start wherever you are.</p><button id="start" class="primary">Write your first entry</button></section>
    <section id="page" class="page" hidden>
      <div class="date-line"><span class="date-mark" aria-hidden="true"></span><time id="created"></time></div>
      <label class="sr-only" for="title">Entry title</label><input id="title" class="title" placeholder="Give today a title…" maxlength="200">
      <div class="page-divider"></div>
      <label class="sr-only" for="content">Diary content</label><textarea id="content" placeholder="What's on your mind?" spellcheck="true"></textarea>
      <footer class="page-footer"><span id="words">0 words</span><span id="modified"></span></footer>
    </section>
    <div id="status" role="status" aria-live="polite"></div>
  </main>
  <dialog id="confirm-dialog"><form method="dialog"><h2 id="dialog-title"></h2><p id="dialog-message"></p><div class="dialog-actions"><button value="cancel">Cancel</button><button id="dialog-accept" class="primary" value="accept">Continue</button></div></form></dialog>
</body>
</html>
